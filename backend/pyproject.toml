[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "valheim-dashboard"
version = "0.1.0"
description = "Panel de control para servidor dedicado de Valheim 1.0"
requires-python = ">=3.12"
authors = [{ name = "Paco" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<2.12",
    "pydantic-settings>=2.4,<2.7",
    "python-a2s>=1.4",
    "psutil>=5.9",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "zstandard>=0.23",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-tools>=7.4",
    "types-psutil",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "RUF"]
ignore = [
    "S101",
    "S104",
    "S105",
    "S106",
    "S107",
    "S110",
    "S311",
    "S324",
    "S501",
    "S603",
    "S607",
    "B008",
    "B904",
    "B905",
    "RUF005",
    "RUF012",
    "RUF059",
    "E501",
    "UP042",
    "ASYNC240",
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "N"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["app"]
explicit_package_bases = true
mypy_path = "."
namespace_packages = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --tb=short"
